name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test --continue

      # Debug: print what XML files were actually generated
      - name: List test result files
        if: always()
        run: find . -name "*.xml" -path "*/test-results/*" | sort

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: "**/build/test-results/**/*.xml"   # ** prefix finds it regardless of exact path
          reporter: java-junit
          fail-on-error: false                      # don't fail the whole workflow if reporter has issues
